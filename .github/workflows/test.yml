name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test app
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild test \
            -project Nook.xcodeproj \
            -scheme Nook \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/TestDerivedData \
            -resultBundlePath build/NookTests.xcresult \
            2>&1 | tee build/xcodebuild-test.log

      - name: Upload test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-diagnostics
          path: |
            build/xcodebuild-test.log
            build/NookTests.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packaging test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r tools/dmg/requirements.txt

      - name: Test packaging validation
        run: python -m unittest discover -s tools/dmg -p 'test_*.py'
